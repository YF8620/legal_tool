<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法律文书规范化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2332 0%, #2d3a4f 50%, #1a2744 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-card {
            width: 100%;
            max-width: 1400px;
            background: linear-gradient(180deg, #ffffff 0%, #f8f9fb 100%);
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            padding: 35px 45px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .page-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1a2744 0%, #c9a962 50%, #1a2744 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e8ecf1;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #c9a962, #e8d5a3, #c9a962);
            border-radius: 2px;
        }

        .header h1 {
            font-size: 30px;
            color: #1a2744;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: #7a8899;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }
            .page-card {
                padding: 25px 30px;
            }
        }

        .box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .box-label {
            font-size: 16px;
            font-weight: 700;
            color: #1a2744;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .box-label::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #c9a962, #8b7355);
            border-radius: 2px;
        }

        textarea {
            width: 100%;
            height: 380px;
            padding: 20px 24px;
            font-size: 16px;
            line-height: 1.9;
            border: 1px solid #dde3ea;
            border-radius: 12px;
            background: linear-gradient(180deg, #fdfefe 0%, #f5f7f9 100%);
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            color: #2a3a4d;
            overflow: hidden;
            font-weight: 400;
        }

        textarea:focus {
            border-color: #c9a962;
            box-shadow: 
                0 0 0 3px rgba(201, 169, 98, 0.15);
        }

        textarea::placeholder {
            color: #a0aab5;
            font-weight: 400;
        }

        .preview {
            width: 100%;
            height: 380px;
            padding: 20px 24px;
            background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
            border: 1px solid #dde3ea;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.9;
            font-size: 16px;
            overflow: hidden;
            color: #2a3a4d;
            text-align: justify;
            font-weight: 400;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        button {
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        .btn-format {
            background: linear-gradient(135deg, #1a2744 0%, #2d4a6f 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 39, 68, 0.25);
        }

        .btn-format:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 39, 68, 0.35);
        }

        .btn-pdf {
            background: linear-gradient(135deg, #8b7355 0%, #c9a962 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 115, 85, 0.25);
        }

        .btn-pdf:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139, 115, 85, 0.35);
        }

        .btn-word {
            background: linear-gradient(135deg, #2d5a45 0%, #3d7a5a 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(45, 90, 69, 0.25);
        }

        .btn-word:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(45, 90, 69, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .legal-format p {
            text-indent: 2em;
            margin: 0.6em 0;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="page-card">
        <div class="header">
            <h1>⚖️ 青少年犯罪法律文书处理工具</h1>
            <p>Juvenile Crime Legal Document Processing</p>
        </div>

        <div class="container">
            <div class="box">
                <div class="box-label">文本编辑</div>
                <textarea id="inputText" placeholder="请在此输入或粘贴涉及青少年犯罪的起诉状、答辩状、代理词等法律文书文本，系统将自动进行规范化排版处理……"></textarea>
                <div class="btn-group">
                    <button class="btn-format" onclick="formatLegal()">📋 一键规范化排版</button>
                    <button class="btn-pdf" onclick="exportPDF()">📄 导出 PDF</button>
                    <button class="btn-word" onclick="exportWord()">📝 导出 Word</button>
                </div>
            </div>

            <div class="box">
                <div class="box-label">预览效果</div>
                <div id="preview" class="preview legal-format"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/docx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        function formatLegal() {
            let text = document.getElementById("inputText").value.trim();
            if (!text) return alert("请输入文书内容");

            let lines = text.split(/\n+/).map(t => t.trim()).filter(t => t);
            let html = lines.map(line => `<p>${line}</p>`).join("");
            document.getElementById("preview").innerHTML = html;
        }

        async function exportWord() {
            const text = document.getElementById("preview").innerText;
            const { Document, Paragraph, Packer, TextRun, HeadingLevel } = window.docx;

            const paragraphs = text.split("\n").filter(line => line.trim()).map(line => {
                return new Paragraph({
                    children: [
                        new TextRun({
                            text: line,
                            size: 28,
                            font: "宋体",
                            theme: { type: "宋体" }
                        })
                    ],
                    spacing: {
                        after: 200,
                        line: 360
                    },
                    indent: {
                        firstLine: 560
                    }
                });
            });

            const doc = new Document({
                sections: [{
                    properties: {},
                    children: paragraphs
                }]
            });

            try {
                const blob = await Packer.toBlob(doc);
                saveAs(blob, "青少年犯罪法律文书.docx");
            } catch (error) {
                alert("导出Word失败，请重试");
                console.error(error);
            }
        }

        async function exportPDF() {
            const preview = document.getElementById("preview");
            const { jsPDF } = window.jspdf;

            try {
                const canvas = await html2canvas(preview, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = canvas.width;
                const imgHeight = canvas.height;

                const ratio = Math.min(pdfWidth / imgWidth * 10, pdfHeight / imgHeight * 10);
                const finalWidth = imgWidth * ratio / 10;
                const finalHeight = imgHeight * ratio / 10;

                pdf.addImage(imgData, 'PNG', 0, 0, finalWidth, finalHeight);
                pdf.save("青少年犯罪法律文书.pdf");
            } catch (error) {
                alert("导出PDF失败，请重试");
                console.error(error);
            }
        }
    </script>
</body>
</html>
